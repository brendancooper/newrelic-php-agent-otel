#
# Build and publish otel-php-agent GitHub Releases, all natively on GitHub
# hosted runners (no Docker / builder images).
#
# Produces, per architecture, a self-contained release tarball matching the
# contract documented in README.md and consumed by agent/install.sh:
#
#   otel-php-agent_<version>_linux_<arch>.tar.gz
#   otel-php-agent_<version>_linux_<arch>.tar.gz.sha256
#
# Per arch the workflow:
#   1. builds the agent C extension for every supported PHP version on the
#      matching hosted runner (PHP provided by shivammathur/setup-php), each
#      run staging a `newrelic-<PHP_API_VERSION>.so` into a per-job artifact,
#   2. (assemble) builds the libc/arch-matched `newrelic-install` +
#      `newrelic-iutil` (C helper) and the Go daemon natively on the same
#      runner, drops all the staged agent .so files into the bundle, then runs
#      `make release-tarball` (which only *stages* already-built artifacts),
#   3. uploads the tarball + sha256 as a job artifact.
#
# A final `publish` job downloads every asset and creates the GitHub Release
# (auto on tag push `v*`, or draft on manual dispatch).
#
# v1 limitation: only glibc (gnu) Linux tarballs are produced (linux_amd64,
# linux_arm64). musl/Alpine tarballs are not built natively — there is no
# native musl GitHub runner; revisit if Alpine support is needed.
#
name: release
run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build from'
        required: true
        default: 'main'
        type: string
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true
        type: string
      draft:
        description: 'Create as a draft release'
        required: true
        default: true
        type: boolean

# Build dependencies installed via apt (kept aligned across the agent- and
# assemble-runner jobs). protobuf-c (libprotobuf-c.a + protoc-c) and libpcre
# are the two real native deps of axiom / the agent extension.
# libpcre is built statically from source (see build-agent) so the agent
# extension embeds it and has no libpcre runtime dependency — Debian's
# libpcre soname is libpcre.so.3 while RHEL's is libpcre.so.1, so a
# shared-linked extension built on Ubuntu would not load on RHEL.
env:
  APT_DEPS_AGENT: >-
    build-essential make git autoconf automake libtool pkg-config gawk
    libprotobuf-c-dev protobuf-c-compiler ca-certificates curl
  APT_DEPS_ASSEMBLE: >-
    build-essential make git pkg-config
  # pcre 8.x (the pcre1 ABI axiom links against). Pinned so the release
  # is reproducible; bump here when updating.
  PCRE_VERSION: "8.45"
  PCRE_URL: "https://sourceforge.net/projects/pcre/files/pcre/8.45/pcre-8.45.tar.gz/download"

jobs:
  meta:
    name: resolve PHP matrix
    runs-on: ubuntu-latest
    outputs:
      # JSON array of {arch, php} combos (arch-appropriate PHP version lists).
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout php_versions.mk
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
        with:
          sparse-checkout: make/php_versions.mk
      - name: Build arch x PHP matrix
        id: matrix
        run: |
          amd64=$(make -f make/php_versions.mk php-versions-json ARCH=amd64)
          arm64=$(make -f make/php_versions.mk php-versions-json ARCH=arm64)
          echo "amd64 PHP versions: $amd64"
          echo "arm64 PHP versions: $arm64"
          matrix=$(jq -nc \
            --argjson a "$amd64" \
            --argjson b "$arm64" \
            '($a | map({arch:"amd64", php:.})) + ($b | map({arch:"arm64", php:.}))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-agent:
    name: agent (${{ matrix.arch }} PHP ${{ matrix.php }})
    needs: meta
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.meta.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Map arch to internal release.mk arch name
        id: arch
        run: |
          case "${{ matrix.arch }}" in
            amd64) int=x64 ;;
            arm64) int=aarch64 ;;
          esac
          echo "int=$int" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.APT_DEPS_AGENT }}

      - name: Build static libpcre (portable extension linkage)
        run: |
          set -e
          mkdir -p pcre && cd pcre
          curl -fsSL -o pcre.tar.gz "${PCRE_URL}"
          tar xzf pcre.tar.gz
          cd "pcre-${PCRE_VERSION}"
          ./configure \
            --prefix="$PWD/../pcre-prefix" \
            --disable-shared --enable-static \
            --enable-unicode-properties --enable-jit --with-pic
          make -j"$(nproc 2>/dev/null || echo 2)"
          make install
          # Make this pcre's pcre-config the one axiom (which calls bare
          # `pcre-config`) picks up, so its headers match the static lib.
          echo "$PWD/../pcre-prefix/bin" >> "$GITHUB_PATH"

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Build agent (stages newrelic-<phpapi>.so)
        run: |
          make agent-for-release \
            RELEASE_OS=linux \
            RELEASE_ARCH=${{ steps.arch.outputs.int }} \
            PCRE_PREFIX="$PWD/pcre/pcre-prefix" \
            PCRE_STATIC=yes

      - name: Save staged extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: agent-so-${{ matrix.arch }}-${{ matrix.php }}
          path: releases/linux/agent/${{ steps.arch.outputs.int }}/
          if-no-files-found: error

  assemble:
    name: assemble (${{ matrix.arch }})
    needs: build-agent
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Resolve release identity
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          ver="${tag#v}"
          case "${{ matrix.arch }}" in
            amd64) int_arch=x64 ;;
            arm64) int_arch=aarch64 ;;
          esac
          echo "version=$ver"      >> "$GITHUB_OUTPUT"
          echo "int_arch=$int_arch" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.APT_DEPS_ASSEMBLE }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Build daemon (native target libc/arch)
        run: make daemon

      - name: Build installer (newrelic-install + newrelic-iutil)
        run: make installer

      - name: Collect staged agent extensions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: agent-so-${{ matrix.arch }}-*
          path: agent-staging
          merge-multiple: true

      - name: Stage agent extensions into the release bundle
        run: |
          set -e
          int_arch="${{ steps.rel.outputs.int_arch }}"
          dst="releases/linux/agent/${int_arch}"
          mkdir -p "$dst"
          files=( $(find agent-staging -type f \( -name '*.so' -o -name '*.map' \) -print) )
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no staged agent .so files found" >&2
            exit 1
          fi
          cp -v "${files[@]}" "$dst/"
          ls -l "$dst"

      - name: Assemble release tarball
        run: |
          make release-tarball \
            RELEASE_OS=linux \
            RELEASE_ARCH=${{ steps.rel.outputs.int_arch }} \
            RELEASE_VERSION=${{ steps.rel.outputs.version }}

      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: |
            releases/*.tar.gz
            releases/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub Release
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          generate_release_notes: true
          files: |
            assets/*.tar.gz
            assets/*.sha256