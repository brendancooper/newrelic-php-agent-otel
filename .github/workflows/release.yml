#
# Build and publish otel-php-agent GitHub Releases.
#
# Why Rocky Linux 9 (not Ubuntu/Debian)? The release artifacts must run on the
# oldest supported production target, which ships glibc 2.34. GitHub-hosted
# Ubuntu runners ship glibc 2.39 (Ubuntu 24.04 / "latest"), so anything linked
# there (the agent .so, the C iutil helper, and the cgo-linked Go daemon)
# records GLIBC_2.38+ symbol requirements and refuses to load on the target.
# Rocky Linux 9 ships glibc 2.34, so building inside a rockylinux:9 container
# caps every artifact's required glibc at 2.34. This is the only reason for the
# container: every native build / link step runs inside it.
#
# Produces, per architecture, a self-contained release tarball matching the
# contract documented in README.md and consumed by agent/install.sh:
#
#   otel-php-agent_<version>_linux_<arch>.tar.gz
#   otel-php-agent_<version>_linux_<arch>.tar.gz.sha256
#
# Per arch the workflow:
#   1. builds the agent C extension for every supported PHP version inside a
#      rockylinux:9 container (PHP provided by the Remi repository's parallel
#      SCL-style phpNN-php packages), each run staging a
#      `newrelic-<PHP_API_VERSION>.so` into a per-job artifact,
#   2. (assemble) inside another rockylinux:9 container builds the libc/arch
#      -matched `newrelic-install` + `newrelic-iutil` (C helper) and the Go
#      daemon natively, drops all the staged agent .so files into the bundle,
#      then runs `make release-tarball` (which only *stages* already-built
#      artifacts),
#   3. uploads the tarball + sha256 as a job artifact.
#
# A final `publish` job downloads every asset and creates the GitHub Release
# (auto on tag push `v*`, or draft on manual dispatch). `meta` (matrix
# resolution) and `publish` compile/link nothing, so they stay on plain
# GitHub-hosted runners — the glibc-pinning concerns only the build jobs.
#
# v1 limitation: only glibc (gnu) Linux tarballs are produced (linux_amd64,
# linux_arm64). musl/Alpine tarballs are not built natively — there is no
# native musl GitHub runner; revisit if Alpine support is needed.
#
name: release
run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build from'
        required: true
        default: 'main'
        type: string
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true
        type: string
      draft:
        description: 'Create as a draft release'
        required: true
        default: true
        type: boolean

# All env vars below are consumed by the container-based build jobs.
env:
# Build dependencies installed via dnf on the Rocky Linux 9 container.
# - libpcre is built statically from source (see build-agent) so the agent
#   extension embeds it and has no libpcre runtime dependency — the soname
#   differs across distros (libpcre.so.3 on Debian, libpcre.so.1 on RHEL), so a
#   shared-linked extension built for one would not load on the other.
# - protobuf-c is likewise built statically from a pinned source tarball
#   (Rocky's CRB lacks a libprotobuf-c pkg, and the agent build system assumes
#   libprotobuf-c lives under $prefix/lib). Its build needs protobuf's protoc +
#   libprotobuf, pulled from Rocky 9 CRB.
# - Per-PHP-version PHP comes from Remi's parallel SCL-style packages
#   (phpNN-php / phpNN-php-devel), which install under /opt/remi/phpNN.
DNF_BASE_DEPS: >-
  gcc gcc-c++ make git pkg-config gawk ca-certificates curl tar
DNF_AGENT_BUILD_DEPS: >-
  autoconf automake libtool
DNF_PROTOBUF_BUILD_DEPS: >-
  protobuf-compiler protobuf-devel
# Rocky Linux 9 container. Tag (not digest) is pinned to the major release so
# we always get the latest 9.x security refresh; bump here when moving to a
# newer Rocky release (and re-confirm the glibc baseline it ships).
ROCKY_IMAGE: "rockylinux:9"
# Vendor deps built statically from source (pinned so the release is
# reproducible; bump here when updating).
PCRE_VERSION: "8.45"
PCRE_URL: "https://sourceforge.net/projects/pcre/files/pcre/8.45/pcre-8.45.tar.gz/download"
PROTOBUF_C_VERSION: "1.5.0"
PROTOBUF_C_URL: "https://github.com/protobuf-c/protobuf-c/releases/download/v1.5.0/protobuf-c-1.5.0.tar.gz"

jobs:
  meta:
    name: resolve PHP matrix
    runs-on: ubuntu-latest
    outputs:
      # JSON array of {arch, php} combos (arch-appropriate PHP version lists).
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout php_versions.mk
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
        with:
          sparse-checkout: make/php_versions.mk
      - name: Build arch x PHP matrix
        id: matrix
        run: |
          amd64=$(make -f make/php_versions.mk php-versions-json ARCH=amd64)
          arm64=$(make -f make/php_versions.mk php-versions-json ARCH=arm64)
          echo "amd64 PHP versions: $amd64"
          echo "arm64 PHP versions: $arm64"
          matrix=$(jq -nc \
            --argjson a "$amd64" \
            --argjson b "$arm64" \
            '($a | map({arch:"amd64", php:.})) + ($b | map({arch:"arm64", php:.}))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-agent:
    name: agent (${{ matrix.arch }} PHP ${{ matrix.php }})
    needs: meta
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ${{ env.ROCKY_IMAGE }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.meta.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Map arch to internal release.mk arch name
        id: arch
        run: |
          case "${{ matrix.arch }}" in
            amd64) int=x64 ;;
            arm64) int=aarch64 ;;
          esac
          echo "int=$int" >> "$GITHUB_OUTPUT"

      # Enable CodeReady Builder (for protobuf protoc + libprotobuf) and the
      # Remi repository (for parallel SCL-style PHP packages). EPEL is not
      # needed: pcre and protobuf-c are both built from source below.
      - name: Enable Rocky repos + install build deps + PHP
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: |
          set -e
          short=$(printf '%s' "$PHP_VERSION" | tr -d .)
          echo "Resolved Remi PHP channel: php${short} (from ${PHP_VERSION})"
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf -y install https://rpms.remirepo.net/enterprise/remi-release-9.rpm
          dnf config-manager --set-enabled remi
          dnf -y install \
            ${{ env.DNF_BASE_DEPS }} \
            ${{ env.DNF_AGENT_BUILD_DEPS }} \
            ${{ env.DNF_PROTOBUF_BUILD_DEPS }} \
            "php${short}-php" "php${short}-php-devel"
          # Remi installs each PHP into /opt/remi/phpNN; expose its bin dir to
          # later steps so the agent build can find php-config / phpize.
          php_bin="/opt/remi/php${short}/root/usr/bin"
          test -x "$php_bin/php-config" -a -x "$php_bin/phpize"
          echo "PHP_BIN_DIR=$php_bin" >> "$GITHUB_ENV"
          "$php_bin/php-config" --version

      - name: Build static libpcre (portable extension linkage)
        run: |
          set -e
          mkdir -p pcre && cd pcre
          curl -fsSL -o pcre.tar.gz "${PCRE_URL}"
          tar xzf pcre.tar.gz
          cd "pcre-${PCRE_VERSION}"
          ./configure \
            --prefix="$PWD/../pcre-prefix" \
            --disable-shared --enable-static \
            --enable-unicode-properties --enable-jit --with-pic
          make -j"$(nproc 2>/dev/null || echo 2)"
          make install
          # Make this pcre's pcre-config the one axiom (which calls bare
          # `pcre-config`) picks up, so its headers match the static lib.
          echo "$PWD/../pcre-prefix/bin" >> "$GITHUB_PATH"

      - name: Build static protobuf-c (pinned, into a controlled prefix)
        run: |
          set -e
          mkdir -p pb && cd pb
          curl -fsSL -o pb.tar.gz "${PROTOBUF_C_URL}"
          tar xzf pb.tar.gz
          cd "protobuf-c-${PROTOBUF_C_VERSION}"
          # protoc + libprotobuf come from Rocky CRB (protobuf-compiler /
          # protobuf-devel); locate them via pkg-config.
          ./configure \
            --prefix="$PWD/../pb-prefix" \
            --disable-shared --enable-static --with-pic
          make -j"$(nproc 2>/dev/null || echo 2)"
          make install
          test -x "$PWD/../pb-prefix/bin/protoc-c"
          test -s "$PWD/../pb-prefix/lib/libprotobuf-c.a"

      - name: Build agent (stages newrelic-<phpapi>.so)
        env:
          # PHP_BIN_DIR was exported by the repo+deps step above.
          PHP_BIN_DIR: ${{ env.PHP_BIN_DIR }}
        run: |
          set -e
          make agent-for-release \
            RELEASE_OS=linux \
            RELEASE_ARCH=${{ steps.arch.outputs.int }} \
            PHP_CONFIG="$PHP_BIN_DIR/php-config" \
            PHPIZE="$PHP_BIN_DIR/phpize" \
            PCRE_PREFIX="$PWD/pcre/pcre-prefix" \
            PCRE_STATIC=yes \
            PROTOBUF_C_PREFIX="$PWD/pb/pb-prefix"

      - name: Save staged extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: agent-so-${{ matrix.arch }}-${{ matrix.php }}
          path: releases/linux/agent/${{ steps.arch.outputs.int }}/
          if-no-files-found: error

  assemble:
    name: assemble (${{ matrix.arch }})
    needs: build-agent
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ${{ env.ROCKY_IMAGE }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Resolve release identity
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          ver="${tag#v}"
          case "${{ matrix.arch }}" in
            amd64) int_arch=x64 ;;
            arm64) int_arch=aarch64 ;;
          esac
          echo "version=$ver"      >> "$GITHUB_OUTPUT"
          echo "int_arch=$int_arch" >> "$GITHUB_OUTPUT"

      # Assemble only needs gcc (for newrelic-iutil), make, git (VERSION/COMMIT
      # derivation), and Go (added by actions/setup-go below). No CRB/EPEL/Remi
      # repos are required for the assemble step.
      - name: Install build dependencies
        run: |
          set -e
          dnf -y install ${{ env.DNF_BASE_DEPS }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Build daemon (native target libc/arch)
        run: make daemon

      - name: Build installer (newrelic-install + newrelic-iutil)
        run: make installer

      - name: Collect staged agent extensions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: agent-so-${{ matrix.arch }}-*
          path: agent-staging
          merge-multiple: true

      - name: Stage agent extensions into the release bundle
        run: |
          set -e
          int_arch="${{ steps.rel.outputs.int_arch }}"
          dst="releases/linux/agent/${int_arch}"
          mkdir -p "$dst"
          files=( $(find agent-staging -type f \( -name '*.so' -o -name '*.map' \) -print) )
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no staged agent .so files found" >&2
            exit 1
          fi
          cp -v "${files[@]}" "$dst/"
          ls -l "$dst"

      - name: Assemble release tarball
        run: |
          make release-tarball \
            RELEASE_OS=linux \
            RELEASE_ARCH=${{ steps.rel.outputs.int_arch }} \
            RELEASE_VERSION=${{ steps.rel.outputs.version }}

      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: |
            releases/*.tar.gz
            releases/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub Release
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          generate_release_notes: true
          files: |
            assets/*.tar.gz
            assets/*.sha256